# ================================================================
# Salesforce Delta Deployment Pipeline
#
# PROMOTION FLOW:
# Feature/* -> DEV -> SIT -> UAT -> master
#
# PR:
#   1. Validate promotion path
#   2. Generate Git delta
#   3. Validate against TARGET Salesforce org
#   4. GitHub status check name = "Salesforce Validation"
#   5. Branch ruleset requires validation + PR approval
#
# AFTER MERGE:
#   1. Push to target branch starts deployment job
#   2. GitHub Environment protection is applied
#   3. SIT/UAT/PROD can require deployment approval
#   4. Delta is deployed to the mapped Salesforce org
#
# BRANCH -> GITHUB ENVIRONMENT -> SALESFORCE ORG -> TEST LEVEL
# DEV     -> DEV  -> DEV Sandbox -> NoTestRun
# SIT     -> SIT  -> SIT Sandbox -> RunLocalTests
# UAT     -> UAT  -> UAT Sandbox -> RunLocalTests
# master  -> PROD -> Production  -> RunAllTestsInOrg
#
# REQUIRED REPOSITORY SECRETS:
# SALESFORCE_AUTH_URL_DEV
# SALESFORCE_AUTH_URL_SIT
# SALESFORCE_AUTH_URL_UAT
# SALESFORCE_AUTH_URL_PROD
#
# REQUIRED GITHUB ENVIRONMENTS:
# DEV  : deployment branch DEV
# SIT  : deployment branch SIT
# UAT  : deployment branch UAT
# PROD : deployment branch master
#
# RECOMMENDED ENVIRONMENT APPROVALS:
# DEV  : no deployment approval
# SIT  : required reviewer
# UAT  : required reviewer
# PROD : required reviewer + prevent self-review
#
# RECOMMENDED BRANCH RULESET REQUIRED STATUS CHECK:
# Salesforce Validation
# ================================================================

name: Salesforce Delta Pipeline

on:
  pull_request:
    branches:
      - DEV
      - SIT
      - UAT
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  push:
    branches:
      - DEV
      - SIT
      - UAT
      - master

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  SALESFORCE_CLI_VERSION: '2.148.3'
  SGD_VERSION: '7.2.0'

concurrency:
  group: salesforce-${{ github.event_name }}-${{ github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: false

jobs:

  validate:
    name: Salesforce Validation
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Validate promotion path
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref }}
        run: |
          echo "Source branch: $SOURCE_BRANCH"
          echo "Target branch: $TARGET_BRANCH"

          case "$TARGET_BRANCH" in
            DEV)
              case "$SOURCE_BRANCH" in
                SIT|UAT|master)
                  echo "::error::Invalid promotion: $SOURCE_BRANCH -> DEV"
                  exit 1
                  ;;
              esac
              ;;
            SIT)
              if [ "$SOURCE_BRANCH" != "DEV" ]; then
                echo "::error::Only DEV can be promoted to SIT."
                exit 1
              fi
              ;;
            UAT)
              if [ "$SOURCE_BRANCH" != "SIT" ]; then
                echo "::error::Only SIT can be promoted to UAT."
                exit 1
              fi
              ;;
            master)
              if [ "$SOURCE_BRANCH" != "UAT" ]; then
                echo "::error::Only UAT can be promoted to master."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported target branch: $TARGET_BRANCH"
              exit 1
              ;;
          esac

          echo "Promotion path is valid."

      - name: Checkout PR head with full Git history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install Salesforce CLI
        run: |
          npm install --global "@salesforce/cli@${SALESFORCE_CLI_VERSION}"
          sf --version

      - name: Install SFDX Git Delta
        run: |
          echo y | sf plugins install "sfdx-git-delta@${SGD_VERSION}"
          sf plugins

      - name: Authenticate DEV
        if: github.base_ref == 'DEV'
        env:
          SFDX_AUTH_URL: ${{ secrets.SALESFORCE_AUTH_URL_DEV }}
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "::error::Repository secret SALESFORCE_AUTH_URL_DEV is missing."
            exit 1
          fi
          AUTH_FILE="$(mktemp)"
          trap 'rm -f "$AUTH_FILE"' EXIT
          printf '%s' "$SFDX_AUTH_URL" > "$AUTH_FILE"
          chmod 600 "$AUTH_FILE"

          sf org login sfdx-url \
            --sfdx-url-file "$AUTH_FILE" \
            --alias target-org \
            --set-default

      - name: Authenticate SIT
        if: github.base_ref == 'SIT'
        env:
          SFDX_AUTH_URL: ${{ secrets.SALESFORCE_AUTH_URL_SIT }}
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "::error::Repository secret SALESFORCE_AUTH_URL_SIT is missing."
            exit 1
          fi
          AUTH_FILE="$(mktemp)"
          trap 'rm -f "$AUTH_FILE"' EXIT
          printf '%s' "$SFDX_AUTH_URL" > "$AUTH_FILE"
          chmod 600 "$AUTH_FILE"

          sf org login sfdx-url \
            --sfdx-url-file "$AUTH_FILE" \
            --alias target-org \
            --set-default

      - name: Authenticate UAT
        if: github.base_ref == 'UAT'
        env:
          SFDX_AUTH_URL: ${{ secrets.SALESFORCE_AUTH_URL_UAT }}
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "::error::Repository secret SALESFORCE_AUTH_URL_UAT is missing."
            exit 1
          fi
          AUTH_FILE="$(mktemp)"
          trap 'rm -f "$AUTH_FILE"' EXIT
          printf '%s' "$SFDX_AUTH_URL" > "$AUTH_FILE"
          chmod 600 "$AUTH_FILE"

          sf org login sfdx-url \
            --sfdx-url-file "$AUTH_FILE" \
            --alias target-org \
            --set-default

      - name: Authenticate PROD
        if: github.base_ref == 'master'
        env:
          SFDX_AUTH_URL: ${{ secrets.SALESFORCE_AUTH_URL_PROD }}
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "::error::Repository secret SALESFORCE_AUTH_URL_PROD is missing."
            exit 1
          fi
          AUTH_FILE="$(mktemp)"
          trap 'rm -f "$AUTH_FILE"' EXIT
          printf '%s' "$SFDX_AUTH_URL" > "$AUTH_FILE"
          chmod 600 "$AUTH_FILE"

          sf org login sfdx-url \
            --sfdx-url-file "$AUTH_FILE" \
            --alias target-org \
            --set-default

      - name: Verify target org authentication
        run: |
          sf org display --target-org target-org

      - name: Resolve validation test level
        id: settings
        env:
          TARGET_BRANCH: ${{ github.base_ref }}
        run: |
          case "$TARGET_BRANCH" in
            DEV)
              TEST_LEVEL="NoTestRun"
              ;;
            SIT|UAT)
              TEST_LEVEL="RunLocalTests"
              ;;
            master)
              TEST_LEVEL="RunAllTestsInOrg"
              ;;
            *)
              echo "::error::Unsupported target branch: $TARGET_BRANCH"
              exit 1
              ;;
          esac

          echo "test_level=$TEST_LEVEL" >> "$GITHUB_OUTPUT"
          echo "Target branch: $TARGET_BRANCH"
          echo "Test level: $TEST_LEVEL"

      - name: Generate PR delta
        env:
          FROM_SHA: ${{ github.event.pull_request.base.sha }}
          TO_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git cat-file -e "${FROM_SHA}^{commit}"
          git cat-file -e "${TO_SHA}^{commit}"

          rm -rf delta
          mkdir -p delta

          sf sgd source delta \
            --from "$FROM_SHA" \
            --to "$TO_SHA" \
            --output-dir delta

      - name: Detect deployable metadata
        id: changes
        run: |
          HAS_PACKAGE=false
          HAS_DESTRUCTIVE=false

          if [ -f "delta/package/package.xml" ] && \
             grep -q "<types>" "delta/package/package.xml"; then
            HAS_PACKAGE=true
          fi

          if [ -f "delta/destructiveChanges/destructiveChanges.xml" ] && \
             grep -q "<types>" "delta/destructiveChanges/destructiveChanges.xml"; then
            HAS_DESTRUCTIVE=true
          fi

          if [ "$HAS_PACKAGE" = true ] || [ "$HAS_DESTRUCTIVE" = true ]; then
            HAS_CHANGES=true
          else
            HAS_CHANGES=false
          fi

          echo "has_package=$HAS_PACKAGE" >> "$GITHUB_OUTPUT"
          echo "has_destructive=$HAS_DESTRUCTIVE" >> "$GITHUB_OUTPUT"
          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"

      - name: Show generated manifests
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          echo "================ package.xml ================"
          cat delta/package/package.xml || true
          echo
          echo "========== destructiveChanges.xml ==========="
          cat delta/destructiveChanges/destructiveChanges.xml || true

      - name: Validate Salesforce deployment
        if: steps.changes.outputs.has_changes == 'true'
        env:
          TARGET_BRANCH: ${{ github.base_ref }}
          TEST_LEVEL: ${{ steps.settings.outputs.test_level }}
          HAS_PACKAGE: ${{ steps.changes.outputs.has_package }}
          HAS_DESTRUCTIVE: ${{ steps.changes.outputs.has_destructive }}
        run: |
          ARGS=(
            --target-org target-org
            --test-level "$TEST_LEVEL"
            --wait 180
          )

          if [ "$HAS_PACKAGE" = true ]; then
            ARGS+=(--manifest delta/package/package.xml)
          else
            ARGS+=(--manifest delta/destructiveChanges/package.xml)
          fi

          if [ "$HAS_DESTRUCTIVE" = true ]; then
            ARGS+=(
              --post-destructive-changes
              delta/destructiveChanges/destructiveChanges.xml
            )
          fi

          if [ "$TARGET_BRANCH" = "master" ]; then
            echo "Running Production validation..."
            sf project deploy validate "${ARGS[@]}"
          else
            echo "Running sandbox dry-run validation..."
            sf project deploy start --dry-run "${ARGS[@]}"
          fi

      - name: No Salesforce metadata changes
        if: steps.changes.outputs.has_changes != 'true'
        run: |
          echo "No deployable Salesforce metadata changes were detected."
          echo "Salesforce Validation completed successfully."

  deploy:
    name: Salesforce Deployment
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 240

    environment:
      name: ${{ github.ref_name == 'master' && 'PROD' || github.ref_name }}

    concurrency:
      group: salesforce-deploy-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout merged branch with full Git history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install Salesforce CLI
        run: |
          npm install --global "@salesforce/cli@${SALESFORCE_CLI_VERSION}"
          sf --version

      - name: Install SFDX Git Delta
        run: |
          echo y | sf plugins install "sfdx-git-delta@${SGD_VERSION}"
          sf plugins

      - name: Authenticate DEV
        if: github.ref_name == 'DEV'
        env:
          SFDX_AUTH_URL: ${{ secrets.SALESFORCE_AUTH_URL_DEV }}
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "::error::Repository secret SALESFORCE_AUTH_URL_DEV is missing."
            exit 1
          fi
          AUTH_FILE="$(mktemp)"
          trap 'rm -f "$AUTH_FILE"' EXIT
          printf '%s' "$SFDX_AUTH_URL" > "$AUTH_FILE"
          chmod 600 "$AUTH_FILE"

          sf org login sfdx-url \
            --sfdx-url-file "$AUTH_FILE" \
            --alias target-org \
            --set-default

      - name: Authenticate SIT
        if: github.ref_name == 'SIT'
        env:
          SFDX_AUTH_URL: ${{ secrets.SALESFORCE_AUTH_URL_SIT }}
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "::error::Repository secret SALESFORCE_AUTH_URL_SIT is missing."
            exit 1
          fi
          AUTH_FILE="$(mktemp)"
          trap 'rm -f "$AUTH_FILE"' EXIT
          printf '%s' "$SFDX_AUTH_URL" > "$AUTH_FILE"
          chmod 600 "$AUTH_FILE"

          sf org login sfdx-url \
            --sfdx-url-file "$AUTH_FILE" \
            --alias target-org \
            --set-default

      - name: Authenticate UAT
        if: github.ref_name == 'UAT'
        env:
          SFDX_AUTH_URL: ${{ secrets.SALESFORCE_AUTH_URL_UAT }}
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "::error::Repository secret SALESFORCE_AUTH_URL_UAT is missing."
            exit 1
          fi
          AUTH_FILE="$(mktemp)"
          trap 'rm -f "$AUTH_FILE"' EXIT
          printf '%s' "$SFDX_AUTH_URL" > "$AUTH_FILE"
          chmod 600 "$AUTH_FILE"

          sf org login sfdx-url \
            --sfdx-url-file "$AUTH_FILE" \
            --alias target-org \
            --set-default

      - name: Authenticate PROD
        if: github.ref_name == 'master'
        env:
          SFDX_AUTH_URL: ${{ secrets.SALESFORCE_AUTH_URL_PROD }}
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "::error::Repository secret SALESFORCE_AUTH_URL_PROD is missing."
            exit 1
          fi
          AUTH_FILE="$(mktemp)"
          trap 'rm -f "$AUTH_FILE"' EXIT
          printf '%s' "$SFDX_AUTH_URL" > "$AUTH_FILE"
          chmod 600 "$AUTH_FILE"

          sf org login sfdx-url \
            --sfdx-url-file "$AUTH_FILE" \
            --alias target-org \
            --set-default

      - name: Verify target org authentication
        run: |
          sf org display --target-org target-org

      - name: Resolve deployment test level
        id: settings
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          case "$TARGET_BRANCH" in
            DEV)
              TEST_LEVEL="NoTestRun"
              ;;
            SIT|UAT)
              TEST_LEVEL="RunLocalTests"
              ;;
            master)
              TEST_LEVEL="RunAllTestsInOrg"
              ;;
            *)
              echo "::error::Unsupported deployment branch: $TARGET_BRANCH"
              exit 1
              ;;
          esac

          echo "test_level=$TEST_LEVEL" >> "$GITHUB_OUTPUT"

      - name: Verify deployment commit range
        env:
          FROM_SHA: ${{ github.event.before }}
          TO_SHA: ${{ github.sha }}
        run: |
          if [[ "$FROM_SHA" =~ ^0+$ ]]; then
            echo "::error::No valid previous commit is available for this push."
            echo "::error::The pipeline will not guess a deployment baseline."
            exit 1
          fi

          git cat-file -e "${FROM_SHA}^{commit}"
          git cat-file -e "${TO_SHA}^{commit}"

          echo "From: $FROM_SHA"
          echo "To:   $TO_SHA"

      - name: Generate deployment delta
        env:
          FROM_SHA: ${{ github.event.before }}
          TO_SHA: ${{ github.sha }}
        run: |
          rm -rf delta
          mkdir -p delta

          sf sgd source delta \
            --from "$FROM_SHA" \
            --to "$TO_SHA" \
            --output-dir delta

      - name: Detect deployable metadata
        id: changes
        run: |
          HAS_PACKAGE=false
          HAS_DESTRUCTIVE=false

          if [ -f "delta/package/package.xml" ] && \
             grep -q "<types>" "delta/package/package.xml"; then
            HAS_PACKAGE=true
          fi

          if [ -f "delta/destructiveChanges/destructiveChanges.xml" ] && \
             grep -q "<types>" "delta/destructiveChanges/destructiveChanges.xml"; then
            HAS_DESTRUCTIVE=true
          fi

          if [ "$HAS_PACKAGE" = true ] || [ "$HAS_DESTRUCTIVE" = true ]; then
            HAS_CHANGES=true
          else
            HAS_CHANGES=false
          fi

          echo "has_package=$HAS_PACKAGE" >> "$GITHUB_OUTPUT"
          echo "has_destructive=$HAS_DESTRUCTIVE" >> "$GITHUB_OUTPUT"
          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"

      - name: Show generated manifests
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          echo "================ package.xml ================"
          cat delta/package/package.xml || true
          echo
          echo "========== destructiveChanges.xml ==========="
          cat delta/destructiveChanges/destructiveChanges.xml || true

      - name: Deploy delta to Salesforce
        if: steps.changes.outputs.has_changes == 'true'
        env:
          TEST_LEVEL: ${{ steps.settings.outputs.test_level }}
          HAS_PACKAGE: ${{ steps.changes.outputs.has_package }}
          HAS_DESTRUCTIVE: ${{ steps.changes.outputs.has_destructive }}
        run: |
          ARGS=(
            --target-org target-org
            --test-level "$TEST_LEVEL"
            --wait 180
          )

          if [ "$HAS_PACKAGE" = true ]; then
            ARGS+=(--manifest delta/package/package.xml)
          else
            ARGS+=(--manifest delta/destructiveChanges/package.xml)
          fi

          if [ "$HAS_DESTRUCTIVE" = true ]; then
            ARGS+=(
              --post-destructive-changes
              delta/destructiveChanges/destructiveChanges.xml
            )
          fi

          sf project deploy start "${ARGS[@]}"

      - name: No Salesforce metadata changes
        if: steps.changes.outputs.has_changes != 'true'
        run: |
          echo "No deployable Salesforce metadata changes were detected."
          echo "Salesforce Deployment completed without metadata changes."